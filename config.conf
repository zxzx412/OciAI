# ============================================
# OCI AI 代理 - 单账户配置示例
# ============================================
# 复制此文件并填写您的实际 OCI 配置

# OCI 认证配置
user        = ocid1.user.oc1..aaaaaaaa[您的用户OCID]
fingerprint = [您的API密钥指纹，格式如 aa:bb:cc:dd:ee:ff:...]
key_file    = ./your-key.pem
tenancy     = ocid1.tenancy.oc1..aaaaaaaa[您的租户OCID]
region      = us-phoenix-1

# ============================================
# 代理服务配置
# ============================================
[PROXY]
# 监听端口
listen_port = 8080
# 默认使用的模型
client_model_name = grok-4
# 强制非流式响应 (true/false)
force_non_stream = false
# 流式模式配置:
# false = 使用 OCI 原生流式 (推荐，实时响应)
# true  = 使用模拟流式 (兼容模式，等待完整响应后模拟)
use_simulated_stream = false
# API 密钥 (留空则启动时自动生成)
api_key = 

# ============================================
# 代理池配置 (用于绕过 IP 封锁，可选)
# ============================================
[PROXY_POOL]
# 是否启用代理池
enabled = false
# 健康检查间隔 (代理失败后等待多久重新检查)
health_check_interval = 60s
# 负载均衡策略: round_robin, weighted, random, least_connections
load_balance_strategy = round_robin

# ============================================
# 自动获取代理配置 (从在线代理源自动获取)
# ============================================
# 是否启用自动获取代理 (从 GitHub 等在线代理源获取免费代理)
# 启用后会自动获取、检查（使用 OCI 域名验证）并保存可用代理到配置文件
# 注意: 免费代理质量较差，建议使用自己的代理服务
auto_fetch = false
# 代理类型: all (所有类型), http, socks4, socks5
auto_fetch_type = socks5
# 最大保存数量 (检查通过后保存的代理数量)
auto_fetch_max_count = 20

# ============================================
# 手动配置代理 (推荐，与自动获取可同时使用)
# ============================================
# 代理服务器配置示例 (启用代理池后生效)
# 支持 HTTP/SOCKS5 代理
# 代理必须能访问 OCI 域名 (generativeai.us-phoenix-1.oci.oraclecloud.com)

# [PROXY_1]
# url = http://127.0.0.1:7890
# weight = 1
# enabled = true

# [PROXY_2]
# url = socks5://127.0.0.1:7891
# weight = 1
# enabled = true

# [PROXY_3]
# # 带认证的代理
# url = http://proxy.example.com:8080
# username = your_username
# password = your_password
# weight = 1
# enabled = true

# ============================================
# 模型映射配置
# ============================================
[MODELS]
# 系统启动时会自动从 OCI API 获取可用模型并生成映射
# 别名规则：使用厂商前缀后的名称
# 例如：xai.grok-4 -> grok-4
#       google.gemini-2.5-pro -> gemini-2.5-pro
#       cohere.command-r-plus -> command-r-plus
#       meta.llama-3-70b-instruct -> llama-3-70b-instruct

# 您也可以手动添加自定义映射（可选）：
# my-custom-model = xai.grok-4
