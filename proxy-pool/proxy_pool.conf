# ============================================
# 代理池服务配置
# ============================================

# 服务端口
port = 8888

# 代理类型 (逗号分隔): http, socks4, socks5
# 留空或设为 all 表示获取所有类型
proxy_types = socks5,http

# 检查超时 (单个代理检查的超时时间)
check_timeout = 15s

# 检查并发数 (同时检查的代理数量，建议 100-500)
check_concurrency = 500

# 刷新间隔 (定时从代理源获取新代理)
refresh_interval = 30m

# 输出文件 (保存可用代理列表，留空则不保存)
output_file = proxies.txt
