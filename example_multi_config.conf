# ============================================
# OCI AI 代理 - 多账户配置示例
# ============================================
# 复制此文件为 multi_config.conf 并填写您的实际配置
# 多账户模式支持负载均衡、故障转移和熔断保护

# ============================================
# 全局配置
# ============================================
[GLOBAL]
# 全局最大并发数
global_max_concurrency = 100
# 请求队列大小
queue_size = 1000
# 重试次数
retry_attempts = 2
# 负载均衡策略: round_robin, weighted, least_connections
load_balance_strategy = round_robin
# 健康检查间隔
health_check_interval = 30s
# 请求超时时间
request_timeout = 60s

# ============================================
# 代理服务配置
# ============================================
[PROXY]
# 监听端口
listen_port = 8080
# API 密钥 (留空则启动时自动生成)
api_key = 
# 强制非流式响应
force_non_stream = false
# 默认最大 token 数
default_max_tokens = 4000

# ============================================
# 代理池配置 (用于绕过 IP 封锁，可选)
# ============================================
[PROXY_POOL]
enabled = false
# 健康检查间隔 (代理失败后等待多久重新检查)
health_check_interval = 60s
# 负载均衡策略: round_robin, weighted, random, least_connections
load_balance_strategy = round_robin

# ============================================
# 自动获取代理配置 (从在线代理源自动获取)
# ============================================
# 是否启用自动获取代理 (从 GitHub 等在线代理源获取免费代理)
# 启用后会自动获取、检查（使用 OCI 域名验证）并保存可用代理到配置文件
# 注意: 免费代理质量较差，建议使用自己的代理服务
auto_fetch = false
# 代理类型: all (所有类型), http, socks4, socks5
auto_fetch_type = socks5
# 最大保存数量 (检查通过后保存的代理数量)
auto_fetch_max_count = 20

# ============================================
# 手动配置代理 (推荐，与自动获取可同时使用)
# ============================================
# 代理服务器配置示例 (启用代理池后生效)
# 支持 HTTP/SOCKS5 代理
# 代理必须能访问 OCI 域名 (generativeai.us-phoenix-1.oci.oraclecloud.com)

# [PROXY_1]
# url = http://127.0.0.1:7890
# weight = 1
# enabled = true

# [PROXY_2]
# url = socks5://127.0.0.1:7891
# weight = 1
# enabled = true

# ============================================
# 熔断器配置
# ============================================
[CIRCUIT_BREAKER]
# 最大失败次数，超过后触发熔断
max_failures = 5
# 熔断重置超时时间
reset_timeout = 60s
# 失败率阈值 (0.5 = 50%)
failure_rate = 0.5
# 最小请求数，低于此数不触发熔断
min_requests = 10
# 统计间隔
stat_interval = 60s
# 半开状态最大调用数
half_open_max_calls = 3

# ============================================
# 模型映射配置
# ============================================
[MODELS]
# 系统启动时会自动从所有启用账户的 OCI API 获取模型
# 别名规则：使用厂商前缀后的名称
# 例如：xai.grok-4 -> grok-4
#       google.gemini-2.5-pro -> gemini-2.5-pro

# ============================================
# 账户配置
# ============================================
# 每个账户使用 [ACCOUNT_N] 格式，N 为数字编号

[ACCOUNT_1]
# 账户标识 (用于日志和监控)
id = primary_account
# OCI 用户 OCID
user = ocid1.user.oc1..aaaaaaaa[您的用户OCID]
# API 密钥指纹
fingerprint = aa:bb:cc:dd:ee:ff:00:11:22:33:44:55:66:77:88:99
# 私钥文件路径
key_file = ./keys/account1.pem
# 租户 OCID
tenancy = ocid1.tenancy.oc1..aaaaaaaa[您的租户OCID]
# 区域
region = us-phoenix-1
# 权重 (用于加权负载均衡，数值越大分配请求越多)
weight = 3
# 单账户最大并发数
max_concurrency = 50
# 是否启用
enabled = true

[ACCOUNT_2]
id = secondary_account
user = ocid1.user.oc1..bbbbbbbb[您的用户OCID]
fingerprint = bb:cc:dd:ee:ff:00:11:22:33:44:55:66:77:88:99:aa
key_file = ./keys/account2.pem
tenancy = ocid1.tenancy.oc1..bbbbbbbb[您的租户OCID]
region = us-chicago-1
weight = 2
max_concurrency = 30
enabled = true

[ACCOUNT_3]
id = backup_account
user = ocid1.user.oc1..cccccccc[您的用户OCID]
fingerprint = cc:dd:ee:ff:00:11:22:33:44:55:66:77:88:99:aa:bb
key_file = ./keys/account3.pem
tenancy = ocid1.tenancy.oc1..cccccccc[您的租户OCID]
region = eu-frankfurt-1
weight = 1
max_concurrency = 20
# 设为 false 可暂时禁用此账户
enabled = false
